<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HoverExplorer 卡片配色批量生成器</title>
<style>
:root{--bg:#14161a;--panel:#1d2026;--line:#2c313a;--tx:#e6e8ec;--mu:#8b93a1;--ac:#6ea8ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Microsoft YaHei UI","Segoe UI",sans-serif}
header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
h1{font-size:17px;margin:0}
header span{color:var(--mu);font-size:12px}
.pane{margin:12px 24px 0;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
label{color:var(--mu);font-size:12px}
select,input,textarea,button{font:inherit;color:var(--tx);background:#111317;border:1px solid var(--line);border-radius:6px;padding:6px 10px}
input[type=number]{width:70px}
textarea{width:100%;min-height:110px;resize:vertical;font-family:Consolas,monospace;font-size:12.5px}
button{cursor:pointer}
button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);color:#0b1220;border-color:var(--ac);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:3px 10px;border-radius:99px;border:1px solid var(--line);cursor:pointer;font-size:12px;color:var(--mu);user-select:none}
.chip.on{background:var(--ac);color:#0b1220;border-color:var(--ac)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;padding:16px 24px 40px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stage{padding:18px 14px;display:flex;flex-direction:column;gap:8px}
.stage.light{background:linear-gradient(135deg,#e3e9f1,#c8d2df)}
.stage.dark{background:linear-gradient(135deg,#12151a,#2b313b)}
.card{height:24px;display:flex;align-items:center;gap:8px;border-radius:4px;overflow:hidden;width:100%;max-width:280px;position:relative;white-space:nowrap}
.card .s{align-self:stretch;flex:none}
.card .n{flex:1;overflow:hidden;text-overflow:ellipsis;padding-left:6px}
.card .b{flex:none;margin-right:5px;padding:0 6px;border-radius:3px;line-height:18px;font-size:.82em}
.meta{padding:8px 12px 12px}
.meta .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px;color:var(--mu)}
.code{display:block;width:100%;height:auto;min-height:60px;padding:8px 10px;background:#111317;border:1px solid #23272f;border-radius:6px;font:12px/1.55 Consolas,monospace;color:#c9d1dc;white-space:pre-wrap;word-break:break-all;resize:vertical;overflow:hidden}
.code:focus{outline:none;border-color:var(--ac)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1px solid #fff2}
.hint{color:var(--mu);font-size:12px}
#lang{margin-left:auto;font-size:12px;color:var(--mu)}
#lang:hover{color:var(--tx)}
.bar{padding:12px 24px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<header><h1 data-i18n="title">HoverExplorer 卡片配色批量生成器</h1><span data-i18n="sub">输出格式：9 行 key=value（bg / fg / badge_bg / badge_fg / strip / strip_w / font / font_size / radius），代码可直接编辑并实时预览</span><button id="lang">English</button></header>

<div class="pane" id="p-gen">
  <div class="row"><label data-i18n="lblStyle">风格（可多选，随机混合）</label></div>
  <div class="chips" id="chips"></div>
  <div class="row" style="margin-top:12px">
    <label data-i18n="lblCount">数量</label><input type="number" id="cnt" value="20" min="1" max="60">
    <label data-i18n="lblFont">字体</label><select id="ft">
      <option selected>Microsoft YaHei Mono</option>
      <option>Microsoft YaHei UI</option>
      <option>Segoe UI</option>
      <option>Consolas</option>
      <option>Cascadia Mono</option>
      <option>KaiTi</option>
      <option>SimSun</option>
      <option>Georgia</option>
      <option>Arial</option>
      <option value="r" data-i18n="optFollow">跟随风格（随机）</option>
    </select>
    <label data-i18n="lblSw">色条宽度</label><select id="sw"><option value="r" data-i18n="optRandomSw">随机 1–5</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
    <label data-i18n="lblFs">字号</label><select id="fs"><option value="r" data-i18n="optRandomFs">随机 10–13</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option></select>
    <label data-i18n="lblRd">圆角</label><select id="rd"><option value="r" data-i18n="optRandomRd">随机 0–10</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>8</option><option>10</option><option>12</option></select>
    <label data-i18n="lblBg">预览底色</label><select id="bk"><option value="auto" data-i18n="optAuto">自动</option><option value="light" data-i18n="optLight">浅色壁纸</option><option value="dark" data-i18n="optDark">深色壁纸</option></select>
    <button class="pri" id="go" data-i18n="btnGen">生成</button>
    <button id="add" data-i18n="btnAdd">追加生成</button>
  </div>
</div>

<div class="bar">
  <button id="copyall" data-i18n="btnCopyAll">复制全部（以空行分隔）</button>
  <button id="clear" data-i18n="btnClear">清空</button>
  <span class="hint" id="stat"></span>
</div>
<div id="grid"></div>

<script>
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.random()*(b-a);
const RI=(a,b)=>Math.floor(R(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- 多语言 ---------- */
const EN_STYLE={"冷色极简":"Cool Minimal","暖色复古":"Warm Retro","高对比深色":"High-Contrast Dark","莫兰迪":"Morandi",
 "霓虹赛博":"Neon Cyber","森林自然":"Forest","海洋蓝调":"Ocean Blues","糖果马卡龙":"Candy Macaron","纸张墨水":"Paper & Ink",
 "玻璃拟态":"Glassmorphism","日落渐暖":"Sunset Warm","孟菲斯撞色":"Memphis Pop"};
const I18N={
 zh:{title:"HoverExplorer 卡片配色批量生成器",
  sub:"输出格式：9 行 key=value（bg / fg / badge_bg / badge_fg / strip / strip_w / font / font_size / radius），代码可直接编辑并实时预览",
  lblStyle:"风格（可多选，随机混合）",lblCount:"数量",lblFont:"字体",lblSw:"色条宽度",lblFs:"字号",lblRd:"圆角",lblBg:"预览底色",
  optFollow:"跟随风格（随机）",optRandomSw:"随机 1–5",optRandomFs:"随机 10–13",optRandomRd:"随机 0–10",
  optAuto:"自动",optLight:"浅色壁纸",optDark:"深色壁纸",
  btnGen:"生成",btnAdd:"追加生成",btnCopyAll:"复制全部（以空行分隔）",btnClear:"清空",btnCopy:"复制",
  stat:n=>`共 ${n} 套`,tagManual:"手动",alertPick:"请至少选一种风格",lang:"English"},
 en:{title:"HoverExplorer Card Palette Generator",
  sub:"Output: 9 key=value lines (bg / fg / badge_bg / badge_fg / strip / strip_w / font / font_size / radius). Code is editable with live preview",
  lblStyle:"Styles (multi-select, randomly mixed)",lblCount:"Count",lblFont:"Font",lblSw:"Strip width",lblFs:"Font size",lblRd:"Radius",lblBg:"Preview backdrop",
  optFollow:"Follow style (random)",optRandomSw:"Random 1–5",optRandomFs:"Random 10–13",optRandomRd:"Random 0–10",
  optAuto:"Auto",optLight:"Light wallpaper",optDark:"Dark wallpaper",
  btnGen:"Generate",btnAdd:"Append",btnCopyAll:"Copy all (blank-line separated)",btnClear:"Clear",btnCopy:"Copy",
  stat:n=>`${n} palette${n>1?"s":""}`,tagManual:"Manual",alertPick:"Select at least one style",lang:"中文"}
};
let lang=localStorage.getItem("he-lang")==="en"?"en":"zh";
const t=()=>I18N[lang];
const styleLabel=k=>lang==="en"?(EN_STYLE[k]||k):k;

/* ---------- 风格预设 ---------- */
const P={
 "冷色极简":{m:"light",h:[[190,230]],s:[8,22],bl:[94,98],ba:[.92,.98],ss:[45,70],sl:[52,62],f:["Segoe UI","Microsoft YaHei UI","Inter"]},
 "暖色复古":{m:"light",h:[[20,45]],s:[30,50],bl:[88,94],ba:[.9,.96],ss:[45,65],sl:[38,50],f:["Georgia","KaiTi","SimSun","Palatino Linotype"]},
 "高对比深色":{m:"dark",h:[[0,360]],s:[5,18],bl:[7,12],ba:[.94,.99],ss:[85,100],sl:[55,65],f:["Consolas","Cascadia Mono","Segoe UI Semibold"]},
 "莫兰迪":{m:"light",h:[[10,40],[150,180],[260,290]],s:[10,22],bl:[84,90],ba:[.9,.95],ss:[18,30],sl:[52,62],f:["Microsoft YaHei UI","Segoe UI","DengXian"]},
 "霓虹赛博":{m:"dark",h:[[280,330],[170,200]],s:[40,70],bl:[8,14],ba:[.88,.96],ss:[95,100],sl:[55,62],f:["Consolas","Cascadia Code","Lucida Console"]},
 "森林自然":{m:"dark",h:[[100,160]],s:[18,32],bl:[12,19],ba:[.9,.96],ss:[40,60],sl:[48,60],f:["Segoe UI","Microsoft YaHei UI","Georgia"]},
 "海洋蓝调":{m:"dark",h:[[195,225]],s:[35,55],bl:[13,20],ba:[.88,.95],ss:[65,85],sl:[55,65],f:["Segoe UI","Microsoft YaHei UI","Calibri"]},
 "糖果马卡龙":{m:"light",h:[[0,360]],s:[55,80],bl:[90,95],ba:[.92,.97],ss:[60,80],sl:[62,72],f:["Comic Sans MS","Microsoft YaHei UI","Segoe UI"]},
 "纸张墨水":{m:"light",h:[[35,55]],s:[18,32],bl:[92,96],ba:[.94,.98],ss:[0,12],sl:[15,30],f:["KaiTi","SimSun","Georgia","Times New Roman"]},
 "玻璃拟态":{m:"dark",h:[[200,260]],s:[10,25],bl:[20,30],ba:[.45,.62],ss:[60,80],sl:[65,75],f:["Segoe UI Variable","Segoe UI","Microsoft YaHei UI"]},
 "日落渐暖":{m:"dark",h:[[5,35]],s:[40,60],bl:[11,17],ba:[.9,.96],ss:[75,95],sl:[55,65],f:["Segoe UI","Microsoft YaHei UI","Trebuchet MS"]},
 "孟菲斯撞色":{m:"light",h:[[0,360]],s:[70,95],bl:[82,90],ba:[.95,1],ss:[80,100],sl:[48,58],f:["Arial Black","Microsoft YaHei UI","Segoe UI Black"]}
};
const sel=new Set(["冷色极简","高对比深色","暖色复古"]);
const chips=$("#chips");
function buildChips(){
 chips.innerHTML="";
 Object.keys(P).forEach(k=>{
  const c=document.createElement("span");c.className="chip"+(sel.has(k)?" on":"");c.textContent=styleLabel(k);
  c.onclick=()=>{sel.has(k)?sel.delete(k):sel.add(k);c.classList.toggle("on")};chips.appendChild(c);
 });
}
function applyLang(){
 document.documentElement.lang=lang==="en"?"en":"zh-CN";
 const d=t();
 document.title=d.title;
 document.querySelectorAll("[data-i18n]").forEach(el=>{
  const v=d[el.dataset.i18n];if(typeof v==="string")el.textContent=v;
 });
 $("#lang").textContent=d.lang;
 buildChips();
 if(items.length)render();
}
$("#lang").onclick=()=>{lang=lang==="en"?"zh":"en";localStorage.setItem("he-lang",lang);applyLang()};

/* ---------- 颜色工具 ---------- */
function hsl2rgb(h,s,l){h=((h%360)+360)%360;s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);
 const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return[f(0),f(8),f(4)].map(v=>Math.round(v*255))}
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${(+a).toFixed(2).replace(/0+$/,"").replace(/\.$/,"")||0})`;
const lum=c=>{const t=c.map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*t[0]+.7152*t[1]+.0722*t[2]};
const cr=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const mix=(c,bk,a)=>c.map((v,i)=>v*a+bk[i]*(1-a));
function parseRGBA(s){const m=/rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)(?:[,\s/]+([\d.]+%?))?\s*\)/i.exec(s||"");
 if(!m)return null;let a=m[4]===undefined?1:(m[4].endsWith("%")?parseFloat(m[4])/100:parseFloat(m[4]));return{c:[+m[1],+m[2],+m[3]],a}}

/* ---------- 生成 ---------- */
function gen(name){
 const p=P[name],dark=p.m==="dark";
 const hr=pick(p.h),h=R(hr[0],hr[1]);
 const bgC=hsl2rgb(h,R(...p.s),R(...p.bl)),ba=R(...p.ba);
 const backdrop=dark?[24,26,30]:[240,243,247];
 const bgEff=mix(bgC,backdrop,ba);
 // fg
 const fgH=h+RI(-15,15);let fl=dark?92:14,fg;
 for(let i=0;i<30;i++){fg=hsl2rgb(fgH,R(4,14),fl);if(cr(fg,bgEff)>=7)break;fl+=dark?1.5:-1.5}
 // strip
 const harmony=pick([0,0,30,-30,150,180,210]);
 const sH=h+harmony;let sC=hsl2rgb(sH,R(...p.ss),R(...p.sl));
 // badge
 const useStrip=Math.random()<.6;
 let bbC,bba;
 if(useStrip){bbC=sC;bba=R(.85,1)}else{bbC=hsl2rgb(h+RI(-10,10),R(p.s[0],p.s[1]+15),dark?R(26,36):R(80,86));bba=R(.9,1)}
 const bbEff=mix(bbC,bgEff,bba);
 let bf=hsl2rgb(h,8,dark?95:10);
 if(cr(bf,bbEff)<4.5)bf=cr([255,255,255],bbEff)>cr([15,15,15],bbEff)?[255,255,255]:[15,15,15];
 return{bg:rgba(bgC,ba),fg:rgba(fg,1),badge_bg:rgba(bbC,bba),badge_fg:rgba(bf,1),strip:rgba(sC,1),
  strip_w:$("#sw").value==="r"?RI(1,5):+$("#sw").value,
  font:$("#ft").value==="r"?pick(p.f):$("#ft").value,
  font_size:$("#fs").value==="r"?RI(10,13):+$("#fs").value,
  radius:$("#rd").value==="r"?RI(0,10):+$("#rd").value,_tag:name}
}
const KEYS=["bg","fg","badge_bg","badge_fg","strip","strip_w","font","font_size","radius"];
const toText=o=>KEYS.map(k=>`${k}=${o[k]}`).join("\n");

/* ---------- 渲染 ---------- */
let items=[];
const NAMES=["Quarterly-Report.pdf","design_notes","src","photo_0412.png"],BADGES=["PDF","12","DIR","PNG"];
function modeOf(o){
 const bk=$("#bk").value;if(bk!=="auto")return bk;
 const p=parseRGBA(o.bg);return p&&lum(p.c)<.35?"dark":"light";
}
function stageHTML(o,i){
 const rows=[0,1].map(j=>`<div class="card" style="background:${o.bg};color:${o.fg};font-family:'${o.font}',sans-serif;font-size:${o.font_size}px;border-radius:${o.radius}px">
    <i class="s" style="width:${o.strip_w}px;background:${o.strip}"></i>
    <span class="n">${NAMES[(i+j*2)%4]}</span>
    <span class="b" style="background:${o.badge_bg};color:${o.badge_fg};border-radius:${Math.min(o.radius,9)}px">${BADGES[(i+j*2)%4]}</span></div>`).join("");
 return `<div class="stage ${modeOf(o)}">${rows}</div>`;
}
function tagHTML(o,i){
 const sw=k=>`<span class="sw" style="background:${o[k]}"></span>`;
 const tag=o._tag==="manual"?t().tagManual:styleLabel(o._tag||"");
 return `#${i+1} ${tag} ${sw("bg")}${sw("fg")}${sw("badge_bg")}${sw("strip")}`;
}
function autosize(el){el.style.height="auto";el.style.height=el.scrollHeight+"px"}
function render(){
 const g=$("#grid");g.innerHTML="";
 items.forEach((o,i)=>{
  const el=document.createElement("div");el.className="item";
  el.innerHTML=`${stageHTML(o,i)}
   <div class="meta"><div class="top"><span class="tag">${tagHTML(o,i)}</span>
   <span><button data-c="${i}">${t().btnCopy}</button> <button data-d="${i}">×</button></span></div>
   <textarea class="code" data-i="${i}" spellcheck="false"></textarea></div>`;
  el.querySelector(".code").value=toText(o);
  g.appendChild(el);
 });
 g.querySelectorAll(".code").forEach(autosize);
 $("#stat").textContent=items.length?t().stat(items.length):"";
}
/* 解析编辑后的文本并写回方案，数值做范围修正 */
function applyText(o,txt){
 const kv={};
 txt.split(/\r?\n/).forEach(l=>{
  const m=/^\s*([a-z_]+)\s*=\s*(.*)$/i.exec(l);
  if(m&&KEYS.includes(m[1].toLowerCase()))kv[m[1].toLowerCase()]=m[2].trim();
 });
 KEYS.forEach(k=>{if(kv[k])o[k]=kv[k]});
 o.strip_w=Math.max(0,Math.min(6,Math.round(+o.strip_w)||0));
 o.font_size=Math.max(6,Math.min(18,Math.round(+o.font_size)||12));
 o.radius=Math.max(0,Math.min(12,Math.round(+o.radius)||0));
}
$("#grid").addEventListener("click",e=>{
 const c=e.target.dataset.c,d=e.target.dataset.d;
 if(c!==undefined)copy(toText(items[c]),e.target);
 if(d!==undefined){items.splice(+d,1);render()}
});
$("#grid").addEventListener("input",e=>{
 const ta=e.target.closest(".code");if(!ta)return;
 const i=+ta.dataset.i,o=items[i],item=ta.closest(".item");
 applyText(o,ta.value);o._tag="manual";
 item.querySelector(".stage").outerHTML=stageHTML(o,i);
 item.querySelector(".tag").innerHTML=tagHTML(o,i);
 autosize(ta);
});
$("#grid").addEventListener("change",e=>{
 const ta=e.target.closest(".code");if(!ta)return;
 const txt=toText(items[+ta.dataset.i]);
 if(ta.value!==txt){ta.value=txt;autosize(ta)}
});
async function copy(txt,btn){
 try{await navigator.clipboard.writeText(txt)}catch{const a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}
 if(btn){const o=btn.textContent;btn.textContent="✓";setTimeout(()=>btn.textContent=o,900)}
}
function make(append){
 const ks=[...sel];if(!ks.length){alert(t().alertPick);return}
 const n=Math.max(1,Math.min(60,+$("#cnt").value||20));
 const arr=Array.from({length:n},(_,i)=>gen(ks[i%ks.length]));
 for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}
 items=append?items.concat(arr):arr;render();
}
$("#go").onclick=()=>make(false);
$("#add").onclick=()=>make(true);
$("#bk").onchange=render;
$("#copyall").onclick=e=>copy(items.map(toText).join("\n\n"),e.target);
$("#clear").onclick=()=>{items=[];render()};

applyLang();
make(false);
</script>
</body>
</html>
